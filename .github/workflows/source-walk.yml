name: source walk

# Walks the paged advisory source month by month, newest first, and keeps one
# rolling release (tag `data`) of YYYY-MM.ndjson.gz files indexed by
# state.json. Each run resumes where the last stopped, works in bursts with
# pauses between them, waits out the source's human check and carries on,
# stops at its time budget, and publishes what it has.
#
# Chaining: when a run ends with work left (its budget, or an error other than
# a stall) and `chain` is above 0, it dispatches one follow-up run of this
# workflow with chain - 1 and every other input unchanged. A run that stalls
# (a human check twice with no progress between) or finishes asks for none.
# The concurrency group keeps runs one at a time; during the backfill a
# scheduled run queues behind the chain.
#
# Every 4 hours. Once the history (or a lane's range) is complete a run lists
# the update window, the records updated since a day before the last window
# began, newest update first, and fetches again those newer than the copy
# held, into the month of their publish date; once a week the whole history's
# run also re-lists the newest two months in full.
#
# Details first, links after: a record is written with null links; once every
# month of the run's lane is complete, a links phase fills them in, newest
# month first.
#
# Lanes: the `lane` input (YYYY-MM..YYYY-MM, newest first; one month is the
# same month twice) runs a walk of that range only, side by side with the
# whole-history walk the schedule runs (lane empty). Each lane keeps its own
# lane-*.json in the release; state.json is rebuilt from all of them. Runs of
# one lane never overlap; different lanes do. A chained run keeps its lane.
#
# Set the repository secret SOURCE_BASE to the source's API base URL
# (Settings → Secrets and variables → Actions → Secrets); it is masked in every log.
on:
  schedule:
    - cron: "40 */4 * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "how many follow-up runs may still follow this one"
        required: false
        default: "3"
      lane:
        description: "months to walk, YYYY-MM..YYYY-MM newest first (empty: the whole history)"
        required: false
        default: ""
      budget:
        description: "minutes the walk may run"
        required: false
        default: "330"
      pace:
        description: "seconds between requests"
        required: false
        default: "1"
      burst:
        description: "listing calls per burst (default 15, 0 for none)"
        required: false
        default: ""
      detail_burst:
        description: "detail and links calls per burst (default 0, no bursts)"
        required: false
        default: ""
      gap:
        description: "seconds between bursts (default 180)"
        required: false
        default: ""
      cooldown:
        description: "minutes to wait after a human check (default 30)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: walk-${{ inputs.lane || 'all' }}
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: refuse without the source secret
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
        run: |
          if [ -z "$BASE" ]; then echo "::error::repository secret SOURCE_BASE is not set"; exit 1; fi
      - name: walk
        id: walk
        env:
          BASE: ${{ secrets.SOURCE_BASE }}
          BUDGET: ${{ inputs.budget || '330' }}
          PACE: ${{ inputs.pace || '1' }}
          BURST: ${{ inputs.burst }}
          DETAIL_BURST: ${{ inputs.detail_burst }}
          GAP: ${{ inputs.gap }}
          COOLDOWN: ${{ inputs.cooldown }}
          CHAIN: ${{ inputs.chain || '3' }}
          LANE: ${{ inputs.lane }}
          RELEASE_TAG: data
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x bin/source-walk
          sha256sum bin/source-walk
          bin/source-walk
          more=$(sed -n 's/^more=//p' "$GITHUB_OUTPUT" | tail -n 1)
          if [ "$more" != true ] || [ "$CHAIN" -le 0 ]; then
            echo "chain: no follow-up run requested (more=${more:-unset}, chain=$CHAIN)"
          fi
      - name: chain
        if: ${{ success() && steps.walk.outputs.more == 'true' && fromJSON(inputs.chain || '3') > 0 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN: ${{ inputs.chain || '3' }}
          BUDGET: ${{ inputs.budget || '330' }}
          PACE: ${{ inputs.pace || '1' }}
          BURST: ${{ inputs.burst }}
          DETAIL_BURST: ${{ inputs.detail_burst }}
          GAP: ${{ inputs.gap }}
          COOLDOWN: ${{ inputs.cooldown }}
          LANE: ${{ inputs.lane }}
        run: |
          left=$((CHAIN - 1))
          gh workflow run source-walk.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f chain="$left" -f budget="$BUDGET" -f pace="$PACE" \
            -f burst="$BURST" -f detail_burst="$DETAIL_BURST" -f gap="$GAP" -f cooldown="$COOLDOWN" \
            -f lane="$LANE"
          echo "chain: follow-up run requested; $left more may follow it"
